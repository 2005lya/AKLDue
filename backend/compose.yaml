services:
  postgres:
    image: postgres:16-alpine
    container_name: akldue-learning-postgres
    environment:
      POSTGRES_DB: akldue
      POSTGRES_USER: akldue
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5433:5432"
    volumes:
      - akldue-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akldue -d akldue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  akldue-postgres: